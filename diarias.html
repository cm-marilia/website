<!DOCTYPE html>
<!-- ===========================================================================
     DIÁRIAS E ADIANTAMENTOS
     Câmara Municipal de Marília
     ===========================================================================

     O QUE É ESTA PÁGINA
     Portal de transparência que exibe as diárias e adiantamentos concedidos
     a vereadores e servidores, em formato de cards, com busca livre e
     filtros por legislatura, gabinete, servidor, ano e mês, exportação em
     CSV, Excel, JSON e XML, e impressão formatada.

     COMO FUNCIONA
     1. Os dados são lidos de abas (por ano) de uma planilha do Google Sheets
        publicadas como CSV (FONTES_POR_ANO, na seção CONFIGURAÇÃO do script).
        O filtro "Legislatura" define QUAIS abas de ano são carregadas de uma
        vez (a legislatura atual tem 4 anos); "Ano" e "Mês" filtram depois,
        já na memória.
     2. Uma segunda planilha (URL_GABINETES) traz a lista de gabinetes, cada
        um marcado com a legislatura ("20" ou "21"); o filtro "Gabinete" só
        mostra os vereadores da legislatura carregada.
     3. A página é hospedada no GitHub Pages e exibida dentro de um <iframe>
        no site oficial: https://www.marilia.sp.leg.br/
     4. A altura do iframe é ajustada automaticamente via postMessage.

     CÓDIGO COMPARTILHADO
     - Estilos comuns a todas as páginas ....... comum.css
     - Funções comuns (texto, datas, iframe,
       download e exportações) ................. comum.js
     Esta página contém apenas o que é específico de diárias: leitura da
     planilha, filtros, ordenação e montagem dos cards.

     FORMATO ESPERADO DA PLANILHA  (ver padrao-planilhas.md no repositório)
     - Linha 1: carimbo "DADOS_ATUALIZADOS_EM: dd/mm/aaaa hh:mm"
       (exibido no selo verde; preenchido pelo Apps Script)
     - Linha 2: cabeçalhos, localizados por NOME (não por posição):
       nome_servidor | cargo | quantidade_diarias | data_partida |
       data_retorno | valor_diarias | valor_adiantamento | dotacao |
       local_destino | cidade_destino | motivacao_viagem
       (os nomes antigos servidor / qtde_diarias continuam sendo aceitos)
     - Linha 3 em diante: os registros
     - Datas dd/mm/aaaa; valores como número (sem "R$")
     - A planilha é dividida em abas por ANO da data de partida. Cada aba
       publicada vira uma URL de CSV; ver FONTES_POR_ANO na CONFIGURAÇÃO.

     MANUTENÇÃO RÁPIDA (o que você normalmente precisa alterar)
     - Publicar aba de ano nova .. adicionar a URL em FONTES_POR_ANO
     - Trocar a lista de gabinetes . variável URL_GABINETES
     - Trocar o site que embute .. variável ORIGEM_PAI (seção CONFIGURAÇÃO)
     - Trocar o brasão ........... arquivo brasao_marilia.png no repositório
     - Ativar o card de totais ... procure por "CARD DE SOMATÓRIA" no HTML

     DEPENDÊNCIAS (carregadas via CDN)
     jQuery 3.7.1 | DataTables 1.13.6 | SheetJS 0.18.5 | PapaParse 5.4.1
     =========================================================================== -->
<html lang="pt-BR">
<head>

    <title>Relatório de Diárias e Adiantamentos</title>

    <!-- Estilos do DataTables (tabela com paginação) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <!-- Fonte Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos compartilhados de todas as páginas do portal -->
    <link rel="stylesheet" href="comum.css" />

    <style>
        /* ESTILOS ESPECÍFICOS DE DIÁRIAS
           A estrutura dos cards (.card-info, .card-header, .info-row…) vem

        .totais-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }

        .total-box label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; display: block; }

            .total-box { border: 1px solid #cbd5e1 !important; border-left: 4px solid #003b75 !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div id="wrapper">

    <!-- ================================================================

                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>
                <button class="btn-filtro" onclick="limparFiltros()">Limpar filtros</button>

        <!-- Painel: botões de exportação e impressão -->

        <!-- ================================================================

        <div class="totais-container">

            <div class="total-box" style="border-left-color:#0284c7;"><label>Soma dos Adiantamentos Filtrados</label><span id="txt-total-adiantamentos">R$ 0,00</span></div>

        <!-- Painel: menu "Exibir X resultados" + contador de registros -->
        <fieldset class="painel-grupo" id="painel-visualizacao" style="padding: 10px 15px;">

        <!-- Tabela-base do DataTables: cada linha renderiza um card completo.
             O cabeçalho fica oculto via CSS (comum.css) -->
        <table id="tabela" style="width:100%" role="presentation">

<!-- ====================================================================
     BIBLIOTECAS EXTERNAS (CDN) + CÓDIGO COMPARTILHADO
     jQuery ......... base para o DataTables e manipulação do DOM
     DataTables ..... paginação e controle de exibição dos cards
     SheetJS (xlsx) . geração do arquivo Excel
     PapaParse ...... leitura correta do CSV (aceita vírgulas e quebras de
                      linha dentro das células, como na motivação da viagem)
     comum.js ....... funções compartilhadas (texto, datas, iframe,
                      download e exportações)
     ==================================================================== -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Domínio que embute o iframe: a altura da página só é enviada para
     este endereço (segurança do postMessage). Use "*" apenas em testes. -->
<script>window.ORIGEM_PAI = "https://www.marilia.sp.leg.br";</script>
<script src="comum.js"></script>

<script>
    /* =======================================================================
       ESPECÍFICO DE DIÁRIAS
       As funções utilitárias (removerAcentos, escapeHtml, escapeXml,
       parseNumeroBR, formatarBRL, formatarDataBR, dataParaTimestamp,
       buscarCSV, indexarColunas, enviarAlturaIframe e o objeto Exportar)
       vêm de comum.js.
       ======================================================================= */

    /* =======================================================================
       1. CONFIGURAÇÃO
       ======================================================================= */

    // 🔴 FONTES DE DADOS — uma URL de CSV por ano da data de partida.
    //
    // A planilha de diárias é dividida em abas por ano. Ao publicar a aba
    // de um ano novo (Arquivo → Compartilhar → Publicar na web → escolher a
    // aba → CSV), acrescente aqui uma linha "ANO": "URL".
    // Passo a passo completo: padrao-planilhas.md, seção 4b.
    const FONTES_POR_ANO = {
        "2026": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtMF3eG1pp1M6Pk6ZOYhabqXwdSa59V9OwpG4974bSTW-Kh0P1_hNmSODwsmTIwtKE-LCLUNvB0yFk/pub?gid=610285154&single=true&output=csv",
        "2025": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtMF3eG1pp1M6Pk6ZOYhabqXwdSa59V9OwpG4974bSTW-Kh0P1_hNmSODwsmTIwtKE-LCLUNvB0yFk/pub?gid=1117138374&single=true&output=csv",
        "2024": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtMF3eG1pp1M6Pk6ZOYhabqXwdSa59V9OwpG4974bSTW-Kh0P1_hNmSODwsmTIwtKE-LCLUNvB0yFk/pub?gid=240692215&single=true&output=csv",
        "2023": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtMF3eG1pp1M6Pk6ZOYhabqXwdSa59V9OwpG4974bSTW-Kh0P1_hNmSODwsmTIwtKE-LCLUNvB0yFk/pub?gid=270273885&single=true&output=csv"
    };

    // 🔴 PLANILHA DE GABINETES: lista usada no filtro "Gabinete".
    // Duas colunas — cabeçalho na 1ª linha: "gabinete" | "legislatura"
    // (ver planilhas_normalizadas/gabinetes.xlsx). A legislatura é "20" ou
    // "21"; o filtro só mostra os gabinetes da legislatura do ano aberto.
    const URL_GABINETES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrEs7gAdVQ9P_mMO9qKXaa80sUO8-o-KYrqTBewtKtVA6_wp-5kzAYSLjryjJtzMMzxmhdAh9bRvwk/pub?gid=1946841856&single=true&output=csv";

    // Legislaturas da Câmara de Marília (mandatos de 4 anos). Ao virar a
    // legislatura (2029), acrescente aqui a nova faixa.
    const LEGISLATURAS = [
        { numero: "21", rotulo: "21ª legislatura (2025–2028)", inicio: 2025, fim: 2028 },
        { numero: "20", rotulo: "20ª legislatura (2021–2024)", inicio: 2021, fim: 2024 },
    ];

    /** Retorna a legislatura ({numero, rotulo}) a que um ano pertence, ou null. */
    function legislaturaDoAno(ano) {
        const a = Number(ano);
        return LEGISLATURAS.find(L => a >= L.inicio && a <= L.fim) || null;
    }

    /** Legislaturas que têm pelo menos um ano configurado em FONTES_POR_ANO,
        da mais recente para a mais antiga. */
    function legislaturasDisponiveis() {
        const nums = new Set();
        Object.keys(FONTES_POR_ANO).forEach(ano => {
            const L = legislaturaDoAno(ano);
            if (L) nums.add(L.numero);
        });
        return LEGISLATURAS.filter(L => nums.has(L.numero));
    }

    /** Anos configurados de uma legislatura, do mais recente para o mais antigo. */
    function anosDaLegislatura(numero) {
        return Object.keys(FONTES_POR_ANO)
            .filter(ano => { const L = legislaturaDoAno(ano); return L && L.numero === numero; })
            .sort((a, b) => Number(b) - Number(a));
    }

    /* =======================================================================
       2. ESTADO GLOBAL
       ======================================================================= */
    let tabela;                  // instância única do DataTables
    let dadosGlobais = [];       // diárias de TODOS os anos da legislatura carregada
    let listaGabinetes = [];     // nomes de gabinetes (para o filtro)
    let carimboAtualizacao = ""; // data de atualização exibida no selo verde

    /* =======================================================================
       3. CARREGAMENTO E PROCESSAMENTO DOS DADOS
       ======================================================================= */

    // Campo interno → nome(s) da coluna na planilha (linha 2). A coluna é
    // localizada por NOME (normalizado: sem acento, minúsculo, espaço→"_"),
    // não por posição. Aceita o nome novo e o antigo (retrocompatível).
    const COL = {
        servidor:     ["nome_servidor", "servidor"],
        cargo:        ["cargo"],
        quantidade:   ["quantidade_diarias", "qtde_diarias"],
        data_partida: ["data_partida"],
        data_retorno: ["data_retorno"],
        valor_diaria: ["valor_diarias"],
        adiantamento: ["valor_adiantamento"],
        dotacao:      ["dotacao"],
        local:        ["local_destino"],
        cidade:       ["cidade_destino"],
        motivacao:    ["motivacao_viagem"],
    };

    /**
     * Converte o texto de um CSV (uma aba de ano) em { carimbo, diarias }.
     * Estrutura esperada:
     *   Linha 1 .... carimbo "DADOS_ATUALIZADOS_EM: ..." (selo verde)
     *   Linha 2 .... cabeçalhos (ver COL)
     *   Linha 3+ ... diárias
     */
    function processarCSV(text) {
        // PapaParse trata células com vírgulas e quebras de linha internas
        const linhas = Papa.parse(text).data;

        // Carimbo de atualização (1ª linha) — pega a data qualquer que seja o rótulo
        let carimbo = "";
        if (linhas.length > 0 && linhas[0][0]) {
            const m = String(linhas[0][0]).match(/(\d{2}\/\d{2}\/\d{4})[,\s]*(\d{2}:\d{2})?/);
            if (m) carimbo = `Dados atualizados em ${m[1]}${m[2] ? ' ' + m[2] : ''}`;
        }

        // Localiza a linha de cabeçalho (procura "servidor" ou "data_partida")
        let ic = 1;
        for (let i = 0; i < Math.min(5, linhas.length); i++) {
            const t = removerAcentos(linhas[i].join(" ").toLowerCase());
            if (t.includes("servidor") || t.includes("data_partida")) { ic = i; break; }
        }

        const idx = indexarColunas(linhas[ic]);
        const posicao = {};
        Object.keys(COL).forEach(campo => {
            for (const nome of COL[campo]) {
                if (nome in idx) { posicao[campo] = idx[nome]; break; }
            }
        });

        // GUARD (B2): as colunas essenciais precisam existir
        const faltando = ["servidor", "data_partida"].filter(c => !(c in posicao));
        if (faltando.length) {
            throw new Error("A planilha não tem as colunas esperadas: " + faltando.map(c => COL[c][0]).join(", ") + ".");
        }

        const pegar = (colunas, campo) => {
            const i = posicao[campo];
            return (i != null && colunas[i] != null) ? String(colunas[i]).trim() : "";
        };

        const diarias = linhas.slice(ic + 1).map(colunas => {
            const obj = {
                servidor:       pegar(colunas, "servidor").toUpperCase(),
                cargo:          pegar(colunas, "cargo"),
                quantidade:     pegar(colunas, "quantidade"),
                data_partida:   formatarDataBR(pegar(colunas, "data_partida")),
                data_retorno:   formatarDataBR(pegar(colunas, "data_retorno")),
                dotacao:        pegar(colunas, "dotacao"),
                local_destino:  pegar(colunas, "local"),
                cidade_destino: pegar(colunas, "cidade"),
                motivacao:      pegar(colunas, "motivacao"),
            };

            // Valores: número (para somar/ordenar) + texto formatado (exibição).
            // Adiantamento vazio ou 0 é tratado como "não houve".
            obj.valor_diaria_num = parseNumeroBR(pegar(colunas, "valor_diaria"));
            obj.valor_diaria_fmt = isNaN(obj.valor_diaria_num) ? "" : formatarBRL(obj.valor_diaria_num);

            const adiantRaw = parseNumeroBR(pegar(colunas, "adiantamento"));
            obj.adiantamento_num = (isNaN(adiantRaw) || adiantRaw === 0) ? 0 : adiantRaw;
            obj.adiantamento_fmt = obj.adiantamento_num ? formatarBRL(obj.adiantamento_num) : "";

            // Peso para ordenar pela data de partida (mais recente primeiro)
            obj.peso_data = dataParaTimestamp(obj.data_partida);

            const buscaUnificada = `${obj.servidor} ${obj.cargo} ${obj.cidade_destino} ${obj.local_destino} ${obj.motivacao} ${obj.dotacao}`;
            obj.busca_indexada = removerAcentos(buscaUnificada.toLowerCase().replace(/\n/g, ' '));
            return obj;
        }).filter(d => d.servidor); // ignora linhas vazias

        return { carimbo, diarias };
    }

    /** Baixa TODAS as abas de ano da legislatura selecionada (e, na 1ª vez, a
        lista de gabinetes), junta tudo em dadosGlobais e monta os filtros. */
    async function carregarDados() {
        $('#loader').show(); $('#main-container').hide();
        try {
            const legs = legislaturasDisponiveis();
            if (!legs.length) throw new Error("Nenhuma aba de ano configurada em FONTES_POR_ANO.");

            let legNum = $('#filtroLegislatura').val();
            if (!legNum || !legs.some(L => L.numero === legNum)) legNum = legs[0].numero;
            const leg = LEGISLATURAS.find(L => L.numero === legNum);

            const anos = anosDaLegislatura(legNum);
            if (!anos.length) throw new Error("A legislatura selecionada não tem anos configurados em FONTES_POR_ANO.");

            // Uma requisição por ano da legislatura (+ gabinetes, só na 1ª carga)
            const pedidos = anos.map(a => buscarCSV(FONTES_POR_ANO[a]));
            const buscarGab = listaGabinetes.length === 0;
            if (buscarGab) pedidos.push(buscarCSV(URL_GABINETES));
            const respostas = await Promise.all(pedidos);
            const csvGabinetes = buscarGab ? respostas.pop() : null;

            // Junta as diárias de todos os anos, marcando o ano e a legislatura
            dadosGlobais = [];
            const carimbos = [];
            respostas.forEach((csv, i) => {
                const parte = processarCSV(csv);
                if (parte.carimbo) carimbos.push(parte.carimbo);
                parte.diarias.forEach(d => {
                    d.ano = (d.data_partida || "").split('/')[2] || anos[i];
                    d.legislatura = legNum;
                    dadosGlobais.push(d);
                });
            });
            carimboAtualizacao = carimbos[0] || "Dados sincronizados";

            if (csvGabinetes != null) {
                // Cada linha: [nome_do_gabinete, legislatura ("20" ou "21")]
                listaGabinetes = Papa.parse(String(csvGabinetes).trim()).data
                    .slice(1)
                    .map(l => ({ nome: String(l[0] || "").trim(), legislatura: String(l[1] || "").trim() }))
                    .filter(g => g.nome);
            }

            if (dadosGlobais.length === 0) {
                throw new Error("A planilha foi lida, mas não retornou nenhuma diária.");
            }

            popularFiltrosDinamicos(leg);
            selecionarPeriodoMaisRecente();
            aplicarFiltros();

            $('#badge-atualizacao').text(`🟢 ${carimboAtualizacao}`);
            $('#loader').hide();
            $('#main-container').fadeIn(400, () => enviarAlturaIframe());
        } catch (e) {
            console.error("Erro ao carregar as diárias: ", e);
            $('#loader').html(`<b style="color:#b91c1c">Não foi possível carregar os dados.<br>${escapeHtml(e.message)}<br><br>Tente recarregar a página.</b>`);
        }
    }

    /* =======================================================================
       4. FILTROS E ORDENAÇÃO
       ======================================================================= */

    /** Preenche os filtros dependentes dos dados carregados:
        - Gabinete: só os vereadores da legislatura carregada (leg).
        - Servidor: os nomes que aparecem nas diárias carregadas.
        - Ano: os anos presentes nos dados (a legislatura tem 4). */
    function popularFiltrosDinamicos(leg) {
        const gabinetesDaLeg = listaGabinetes
            .filter(g => !leg || !g.legislatura || g.legislatura === leg.numero)
            .map(g => g.nome);

        let htmlGab = '<option value="">Gabinete</option>';
        [...new Set(gabinetesDaLeg)].sort((a, b) => a.localeCompare(b, 'pt-BR'))
            .forEach(g => { htmlGab += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`; });
        $('#filtroGabinete').html(htmlGab);

        let htmlServ = '<option value="">Servidor</option>';
        [...new Set(dadosGlobais.map(d => d.servidor))].sort((a, b) => a.localeCompare(b, 'pt-BR'))
            .forEach(s => { htmlServ += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`; });
        $('#filtroServidor').html(htmlServ);

        let htmlAno = '<option value="">Ano</option>';
        [...new Set(dadosGlobais.map(d => d.ano))].filter(Boolean).sort((a, b) => Number(b) - Number(a))
            .forEach(a => { htmlAno += `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`; });
        $('#filtroAno').html(htmlAno);
    }

    /** Alinha os filtros de Ano e Mês à diária mais recente carregada (pela
        data de partida). Usado na carga inicial e em "Limpar filtros". */
    function selecionarPeriodoMaisRecente() {
        if (!dadosGlobais.length) return;
        const maisRecente = dadosGlobais.reduce((max, d) => d.peso_data > max.peso_data ? d : max, dadosGlobais[0]);
        const p = (maisRecente.data_partida || "").split('/');
        if (p.length === 3) {
            $('#filtroAno').val(p[2]);
            $('#filtroMes').val(p[1].padStart(2, '0'));
        }
    }

    /**
     * Aplica os filtros sobre dadosGlobais e ordena por data de partida
     * (mais recente primeiro).
     * - A busca livre ignora acentos e maiúsculas.
     * - O filtro de Gabinete compara o nome do gabinete com o nome do
     *   servidor E com o cargo, pois o nome do vereador costuma aparecer
     *   no cargo dos assessores ("ASSESSOR ... do Ver. Fulano").
     * - O filtro de Mês usa o mês da data de partida.
     */
    function aplicarFiltros() {
        const txt = removerAcentos($('#filtroTexto').val().toLowerCase());
        const gab = removerAcentos(($('#filtroGabinete').val() || "").toLowerCase());
        const serv = $('#filtroServidor').val();
        const ano = $('#filtroAno').val();
        const mes = $('#filtroMes').val();

        const res = dadosGlobais.filter(d => {
            const matchTexto = !txt || d.busca_indexada.includes(txt);
            const matchGab = !gab || d.busca_indexada.includes(gab);
            const matchServ = !serv || d.servidor === serv;
            const matchAno = !ano || d.ano === ano;
            const matchMes = !mes || (!!d.data_partida && d.data_partida.split('/')[1] === mes);
            return matchTexto && matchGab && matchServ && matchAno && matchMes;
        });

        res.sort((a, b) => b.peso_data - a.peso_data);
        renderizar(res);
    }

    /** Limpa os filtros e volta ao padrão: mês da diária mais recente.
        Não altera a legislatura selecionada (#filtroLegislatura). */
    function limparFiltros() {
        $('#filtroTexto').val('');
        $('select').not('#filtroLegislatura').val('');
        selecionarPeriodoMaisRecente();
        aplicarFiltros();
    }

    /* =======================================================================
       5. TABELA DE CARDS (DataTables)
       ======================================================================= */

    /** Cria a instância do DataTables e define como cada card é desenhado. */
    function inicializarTabela() {
        tabela = $('#tabela').DataTable({
            data: [],
            pageLength: 10,
            ordering: false, // a ordenação por data de partida é feita em aplicarFiltros()
            language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json', lengthMenu: "Exibir _MENU_ resultados" },
            dom: 'lrt<"dt-bottom-controls"ip>', // l=menu exibir, r=processando, t=tabela, i=info, p=paginação
            columns: [{
                data: null,
                render: function(d) {
                    const cargo = d.cargo
                        ? `<span style="font-size:11px; color:#64748b; font-weight:600; text-transform:uppercase;">${escapeHtml(d.cargo)}</span>`
                        : '';
                    const motivacao = d.motivacao ? escapeHtml(d.motivacao).replace(/\n/g, '<br>') : '-';

                    return `
                        <div class="card-info">
                            <div class="card-header">
                                <div class="card-header-texto">
                                    <span class="nome-principal">${escapeHtml(d.servidor || 'Servidor não informado')}</span>
                                    ${cargo}
                                </div>
                            </div>

                            <div class="card-body">
                                <div class="info-row">
                                    <div class="info-col">
                                        <span class="info-label">Quantidade de Diárias</span>
                                        <span class="info-valor">${escapeHtml(d.quantidade || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Partida</span>
                                        <span class="info-valor">${escapeHtml(d.data_partida || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Retorno</span>
                                        <span class="info-valor">${escapeHtml(d.data_retorno || '-')}</span>
                                    </div>
                                </div>

                                <div class="info-row">
                                    <div class="info-col">
                                        <span class="info-label">Valor das Diárias</span>
                                        <span class="info-valor">${escapeHtml(d.valor_diaria_fmt || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Adiantamento</span>
                                        <span class="info-valor">${escapeHtml(d.adiantamento_fmt || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Dotação</span>
                                        <span class="info-valor">${escapeHtml(d.dotacao || '-')}</span>
                                    </div>
                                </div>

                                <div class="info-row">
                                    <div class="info-col full-width" style="background:transparent; border:0; padding:0;">
                                        <span class="info-label">Cidade de Destino</span>
                                        <span class="info-valor">${escapeHtml(d.cidade_destino || '-')}</span>
                                    </div>
                                </div>
                                <div class="info-row">
                                    <div class="info-col full-width" style="background:transparent; border:0; padding:0;">
                                        <span class="info-label">Local de Destino</span>
                                        <span class="info-valor">${escapeHtml(d.local_destino || '-')}</span>
                                    </div>
                                </div>

                                <div class="info-row" style="margin-top: 5px;">
                                    <div class="info-col full-width">
                                        <span class="info-label">Motivação da Viagem</span>
                                        <span class="info-valor" style="font-weight: 500; font-size: 12.5px;">${motivacao}</span>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }
            }],
            initComplete: function() {
                // Move o menu "Exibir X resultados" para o painel Visualização
                $('.dataTables_length').appendTo('#comprimento-tabela');
            },
            drawCallback: function() {
                // Soma diárias e adiantamentos dos registros filtrados.
                // Os totais alimentam o card de somatória (quando ativado no HTML).
                let sD = 0, sA = 0;
                this.api().rows().data().each(d => {
                    if (!isNaN(d.valor_diaria_num)) sD += d.valor_diaria_num;
                    sA += d.adiantamento_num || 0;
                });
                $('#txt-total-diarias').text(formatarBRL(sD));
                $('#txt-total-adiantamentos').text(formatarBRL(sA));

                const total = this.api().rows().count();
                $('#contagem-registros').html(`<b>${total}</b> diárias encontradas`);
                enviarAlturaIframe();
            }
        });

        // Ao trocar de página, rola suavemente de volta ao topo da lista
        tabela.on('page.dt', function () {
            setTimeout(function() { document.getElementById('painel-visualizacao').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        });
    }

    /** Substitui os dados exibidos na tabela (sem destruí-la). */
    function renderizar(dados) {
        if (!tabela) inicializarTabela();
        tabela.clear();
        tabela.rows.add(dados);
        tabela.draw();
    }

    /* =======================================================================
       6. EXPORTAÇÕES
       As exportações em si estão em comum.js (objeto Exportar). Aqui só
       montamos a lista de diárias filtradas e o nome do arquivo.
       ======================================================================= */

    /** Converte as diárias filtradas para o formato de exportação. */
    function dadosParaExportar() {
        return tabela.rows().data().toArray().map(d => ({
            "Legislatura": d.legislatura ? `${d.legislatura}ª` : '',
            "Servidor": d.servidor || '',
            "Cargo": d.cargo || '',
            "Quantidade de Diarias": d.quantidade || '',
            "Data de Partida": d.data_partida || '',
            "Data de Retorno": d.data_retorno || '',
            "Valor das Diarias": isNaN(d.valor_diaria_num) ? '' : d.valor_diaria_num,
            "Valor do Adiantamento": d.adiantamento_num || '',
            "Dotacao": d.dotacao || '',
            "Cidade de Destino": d.cidade_destino || '',
            "Local de Destino": d.local_destino || '',
            "Motivacao da Viagem": d.motivacao || ''
        }));
    }

    /** Monta o nome do arquivo a partir do ano e dos filtros ativos
        (ex: diarias_2026_maio, diarias_2025_joao_da_silva). */
    function gerarNomeArquivoBase() {
        let partes = ["diarias", ($('#filtroLegislatura').val() || "") + "a_legislatura"];

        const ano = $('#filtroAno').val();
        if (ano) partes.push(ano);

        const serv = $('#filtroServidor').val();
        const gab = $('#filtroGabinete').val();
        if (serv) partes.push(serv.replace(/\s+/g, '_'));
        else if (gab) partes.push(gab.replace(/\s+/g, '_'));

        const mes = $('#filtroMes').val();
        partes.push(mes ? $('#filtroMes option:selected').text() : "todos_os_meses");

        return removerAcentos(partes.join('_')).replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
    }

    function exportarCSV()  { Exportar.csv(dadosParaExportar(), gerarNomeArquivoBase()); }
    function exportarXLSX() { Exportar.xlsx(dadosParaExportar(), gerarNomeArquivoBase(), "Diarias"); }
    function exportarJSON() { Exportar.json(dadosParaExportar(), gerarNomeArquivoBase()); }
    function exportarXML()  { Exportar.xml(dadosParaExportar(), gerarNomeArquivoBase(), { raiz: "diarias", item: "diaria" }); }

    /* =======================================================================
       7. IMPRESSÃO
       ======================================================================= */

    /**
     * Imprime TODAS as diárias filtradas (não apenas a página atual):
     *   1. Expande a paginação para exibir tudo (page.len(-1)).
     *   2. Espera o evento draw.dt — sinal de que o DataTables terminou de
     *      renderizar — em vez de um tempo fixo, que falharia com muitos dados.
     *   3. Abre a janela de impressão e restaura a paginação anterior.
     */
    function imprimirSeguro() {
        if (!tabela) return;
        const len = tabela.page.len(); // guarda a paginação atual
        tabela.one('draw.dt', function() {
            setTimeout(() => {
                window.print();
                tabela.page.len(len).draw('page'); // restaura após imprimir
            }, 100);
        });
        tabela.page.len(-1).draw('page'); // -1 = mostrar todos
    }

    /* =======================================================================
       8. INICIALIZAÇÃO
       ======================================================================= */
    $(document).ready(function() {
        // Seletor de legislatura: inicia na mais recente; trocar recarrega os
        // dados (baixa todos os anos daquela legislatura).
        const legs = legislaturasDisponiveis();
        $('#filtroLegislatura')
            .html(legs.map(L => `<option value="${L.numero}">${escapeHtml(L.rotulo)}</option>`).join(''))
            .val(legs.length ? legs[0].numero : '')
            .on('change', carregarDados);

        // Busca livre com debounce: espera 250ms após a última tecla
        let debounceBusca;
        $('#filtroTexto').on('input', function() {
            clearTimeout(debounceBusca);
            debounceBusca = setTimeout(aplicarFiltros, 250);
        });

        // Filtros de seleção aplicam imediatamente ao mudar
        // (exceto #filtroLegislatura, que recarrega os dados — ligado acima)
        $('select').not('#filtroLegislatura').on('change', aplicarFiltros);

        carregarDados();
    });
</script>
